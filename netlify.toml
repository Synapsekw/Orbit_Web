[build]
  command = "npm run build && npm run check:public"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  # Public defaults can be misclassified as secrets during .env import.
  # Keep scanning enabled for OpenAI, Grok and ORBI_SESSION_SECRET.
  SECRETS_SCAN_OMIT_KEYS = "ORBI_ALLOWED_ORIGINS,ORBI_MODEL,ORBI_PROVIDER_ENDPOINT,ORBI_REASONING_EFFORT,ORBI_TOKEN_PARAMETER,ORBI_OUTPUT_TOKENS"

[functions]
  node_bundler = "esbuild"
  included_files = ["server/knowledge.txt"]

[context.production.environment]
  ORBIT_PUBLIC_BUILD = "1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, noarchive"
